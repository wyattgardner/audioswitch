name: Upstream Audio Over IP check

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Check upstream and test-build the patch
        id: check
        shell: pwsh
        run: |
          $out = & ./sender/check-upstream.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out
          "code=$code" >> $env:GITHUB_OUTPUT
          $out | Set-Content result.txt
          if ($code -ne 0 -and $code -ne 10 -and $code -ne 20) { exit $code }
          exit 0
      - name: Open an issue for a new release
        if: steps.check.outputs.code == '10' || steps.check.outputs.code == '20'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = Get-Content result.txt -Raw
          $title = if ('${{ steps.check.outputs.code }}' -eq '10') { 'New Audio Over IP release: headless patch builds' } else { 'New Audio Over IP release: headless patch needs updating' }
          $open = gh issue list --state open --search "in:title New Audio Over IP release" --json number --jq 'length'
          if ($open -eq '0') { gh issue create --title $title --body $body }
