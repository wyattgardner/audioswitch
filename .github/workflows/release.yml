name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Check the tag matches VERSION
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match VERSION $version" }
      - name: Build installer
        shell: powershell
        run: ./build-release.ps1
      - name: Create release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $log = Get-Content CHANGELOG.md -Raw
          $notes = [regex]::Match($log, "(?s)## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=\n## \[|\z)").Groups[1].Value.Trim()
          $notes += "`n`nInstall: download AudioSwitch-Setup-$version.exe and run it on both machines."
          $notes | Set-Content notes.md -Encoding UTF8
          gh release create "${{ github.ref_name }}" "dist/AudioSwitch-Setup-$version.exe" --title "AudioSwitch v$version" --notes-file notes.md
